name: Verify RehearseDB
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test and assemble the distribution
        shell: bash
        run: ./gradlew test installDist distZip --no-daemon --console=plain
      - name: Rehearse both shipping rollbacks
        shell: bash
        run: build/install/rehearsedb/bin/rehearsedb demo --out build/shipping
      - name: Check a 100,000-row migration under a bounded JVM heap
        run: python checks/volume_smoke.py --install-dir build/install/rehearsedb
      - name: Install the MCP test client
        run: python -m pip install --disable-pip-version-check mcp==1.26.0
      - name: Read both reports with the official MCP client
        shell: bash
        run: |
          python checks/mcp_smoke.py --install-dir build/install/rehearsedb --report build/shipping/reversible/report.json
          python checks/mcp_smoke.py --install-dir build/install/rehearsedb --report build/shipping/lossy/report.json
      - name: Save test results and shipping reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            build/test-results/test/*.xml
            build/shipping/*/report.*
